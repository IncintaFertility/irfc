<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none" aria-hidden="true">
  <!--
    INCINTA · 莲花辅助意象
    一念花开，未来已在其中。
    表现方式：单片花瓣 · 抽象绽放 · 莲瓣光影
    不做：传统莲花纹样 · 宗教化图形 · 复杂线描 · 第二 Logo
  -->
  <defs>
    <linearGradient id="petalLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f4f1e8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d8d2c0" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="petalVein" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#c6ad5c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c6ad5c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <path
    d="M100 12 C 132 58, 154 116, 148 158 C 143 194, 122 224, 100 232
       C 78 224, 57 194, 52 158 C 46 116, 68 58, 100 12 Z"
    fill="url(#petalLight)"
  />

  <path
    d="M100 30 C 104 84, 106 140, 100 214"
    stroke="url(#petalVein)"
    stroke-width="1.25"
    stroke-linecap="round"
  />
  <path
    d="M100 78 C 116 104, 126 132, 126 160"
    stroke="url(#petalVein)"
    stroke-width="0.75"
    stroke-linecap="round"
    opacity="0.7"
  />
  <path
    d="M100 78 C 84 104, 74 132, 74 160"
    stroke="url(#petalVein)"
    stroke-width="0.75"
    stroke-linecap="round"
    opacity="0.7"
  />
</svg>
